# ReturnTrip config for Sure (https://github.com/we-promise/sure) at commit cd5ad7e, PR #4754 itself,
# which fixed the sign flip. The negative control for sure-44aad3a.yaml: same journey, same data.
# Sure is unmodified and runs from its own published image (scripts/sure-stack.sh).
# Kane logs in, exports the family data zip, imports transactions.csv into an empty family through
# Sure's import wizard with its default settings, and exports again.
schemaVersion: 1
project: sure-cd5ad7e

application:
  mode: attached
  origin: http://127.0.0.1:3300
  lifecycle:
    healthPath: /up
    seed: [docker, exec, sure-rt-web-1, bin/rails, runner, /returntrip/seed_sure.rb, /returntrip/source.csv, cd5ad7e]

source:
  kind: manifestCsv
  path: ./source.csv
  sha256: 660f3855445ce354e36862b5763c51a3b902c445d0ba383099fc42279d615bb4
  provenance: ./provenance.json

contract:
  version: 1
  encoding: utf8
  delimiter: ','
  identity:
    mode: uniqueKey
    fields: [notes]
  order: ignore
  extraColumns: reject
  fields:
    - { name: date, type: date, formats: [YYYY-MM-DD] }
    - { name: account_name, type: string }
    - { name: amount, type: decimal, scale: 4 }
    - { name: name, type: string }
    - { name: category, type: string, nullable: true, nullMarkers: [''] }
    - { name: tags, type: string, nullable: true, nullMarkers: [''] }
    - { name: notes, type: string }
    - { name: currency, type: string }

journey:
  sourceWorkspace: sure-source
  destinationWorkspace: sure-restore
  workspaceUrl: '{origin}/sessions/new?email={workspace}%40returntrip.test'
  export: >-
    Go to {sourceUrl}, type returntrip-local-1 into the Password field and click 'Log in'.
    Go to {origin}/family_exports and click 'New Export', then click 'Export data'.
    Wait until the newest export shows 'Complete' (the list refreshes by itself), then click that export's Download icon,
    then verify the newest export still shows 'Complete'.
  createDestination: >-
    Go to {destinationUrl}, type returntrip-local-1 into the Password field and click 'Log in'.
    Go to {origin}/transactions and verify that no transactions are listed.
  restore: >-
    Go to {destinationUrl}, type returntrip-local-1 into the Password field and click 'Log in'.
    Go to {origin}/imports/new and click 'Import transactions'.
    Upload the file {restoreFile} into the CSV file input and continue to the configuration step.
    Set the Date column to 'date', Amount to 'amount', Currency to 'currency', Account to 'account_name', Name to 'name' and Notes to 'notes'.
    Leave every other setting as it is and click 'Apply configuration'.
    Click 'Next step', click 'Next' on each following page, then click 'Publish import'.
    Click 'Check status' until the page shows 'Import successful', then verify it shows 'Import successful'.
  reexport: >-
    Go to {destinationUrl}, type returntrip-local-1 into the Password field and click 'Log in'.
    Go to {origin}/family_exports and click 'New Export', then click 'Export data'.
    Wait until the newest export shows 'Complete', then click that export's Download icon,
    then verify the newest export still shows 'Complete'.

capture:
  mode: responseProxy
  route: /rails/active_storage/disk/:key/:filename
  method: GET
  contentTypes: [application/zip]
  maxBytes: 10485760
  duplicates: identical
  extract: { format: zip, entry: transactions.csv }
  restoreRoute: /imports/:id/upload
  restoreMethod: POST
  restoreFileField: import[import_file]

limits:
  browserRunTimeoutMs: 420000
  overallTimeoutMs: 3600000
  maxBrowserRetries: 1
  maxRows: 50000
  maxKaneCredits: 800
